[project]
name = "t0-powerbi"
version = "0.1.0"
description = "Local t0-gamma probabilistic forecasts inside Power BI Desktop via Python in Power Query"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    # 0.6.0 is the first release that reads t0-gamma's config conventions correctly.
    "tfc-t0[torch]>=0.6.0",
    "pandas>=2.2",
    # Power BI Desktop requires matplotlib in any Python environment it runs.
    "matplotlib>=3.8",
]

[project.scripts]
t0-powerbi-setup = "t0_powerbi.model:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t0_powerbi"]
